{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Mueblería Torres{% endblock %}</title>

<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins', sans-serif;
    background:
        linear-gradient(rgba(245,238,228,.88), rgba(235,222,208,.88)),
        url("{% static 'img/fondo-madera.jpg' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    min-height:100vh;
}

.navbar{
    background:
        linear-gradient(rgb(25 14 6 / 0), rgb(25 14 6 / 0)),
        url("{% static 'img/fondo-madera.jpg' %}") !important;
    background-size:cover !important;
    background-position:center !important;
    background-repeat:no-repeat !important;
    box-shadow:0 8px 25px rgba(0,0,0,.22);
    padding:10px 0;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar-brand{
    display:flex;
    align-items:center;
}

.logo-navbar{
    height:50px;
    width:auto;
    object-fit:contain;
    transition:.25s;
}

.logo-navbar:hover{
    transform:scale(1.05);
}

.navbar .nav-link{
    font-weight:600;
    color:#f1f1f1 !important;
    margin-left:14px;
    transition:.25s;
}

.navbar .nav-link:hover{
    color:#ff4b22 !important;
}

.navbar-toggler{
    border:none;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25d366;
    color:white;
    padding:15px 18px;
    border-radius:50%;
    font-size:24px;
    text-decoration:none;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
    z-index:999;
}

footer{
    background: #000000;
    color: #ffffff;
    padding:40px 0;
    margin-top:60px;
}

.btn-catalogo{
    background:#ff4b22 !important;
    color:#ffffff !important;
    border:none !important;
    padding:14px 32px;
    border-radius:40px;
    font-weight:700;
    text-decoration:none;
    display:inline-block;
    box-shadow:0 8px 20px rgba(255,75,34,.35);
    transition:.3s;
}

.btn-catalogo:hover{
    background:#e13e18 !important;
    color:#ffffff !important;
    transform:scale(1.05);
}

{% block extra_css %}{% endblock %}
</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand" href="/">
    <img src="{% static 'img/logo.png' %}" alt="Mueblería Torres" class="logo-navbar">
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
<li class="nav-item"><a class="nav-link" href="/catalogo/">Catálogo</a></li>
<li class="nav-item"><a class="nav-link" href="/catalogo/?oferta=1">Ofertas</a></li>
<li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
</ul>
</div>

</div>
</nav>

{% block content %}
{% endblock %}

<a href="https://wa.me/542664158982" class="whatsapp">📱</a>

<footer>
<div class="container text-center">
<h4>Mueblería Torres</h4>
<p>Una Firma, Un estilo</p>
<p>📍 Tilisarao-San luis, Argentina | 📞 +54 2664158982</p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
