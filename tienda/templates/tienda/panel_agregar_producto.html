{% extends 'tienda/base.html' %}
{% load static %}

{% block title %}Agregar producto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/panel_productos.css' %}">
{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="edit-panel-box">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="panel-label">Nuevo producto</span>
                <h1 class="fw-bold mt-2">Agregar producto</h1>
                <p class="text-muted mb-0">Cargá un nuevo producto al catálogo.</p>
            </div>

            <a href="{% url 'panel_admin' %}" class="btn btn-outline-dark rounded-pill">
                Volver
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row g-4">

                <div class="col-md-6">
                    <label>Nombre del producto</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>

                <div class="col-md-3">
                    <label>Categoría</label>
                    <select name="categoria" class="form-select">
                        {% for valor, texto in categorias %}
                        <option value="{{ valor }}">{{ texto }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Tipo de colchón</label>
                    <select name="tipo_colchon" class="form-select">
                        {% for valor, texto in tipos_colchon %}
                        <option value="{{ valor }}">{{ texto }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-12">
                    <label>Descripción</label>
                    <textarea name="descripcion" rows="5" class="form-control"></textarea>
                </div>

                <div class="col-md-4">
                    <label>Precio interno</label>
                    <input type="number" name="precio" class="form-control" value="0">
                </div>

                <div class="col-md-4">
                    <label>Stock</label>
                    <input type="number" name="stock" class="form-control" value="0">
                </div>

                <div class="col-md-4">
                    <label>Precio oferta</label>
                    <input type="number" name="precio_oferta" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Imagen principal</label>
                    <input type="file" name="imagen" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Imagen 2</label>
                    <input type="file" name="imagen_2" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Imagen 3</label>
                    <input type="file" name="imagen_3" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="check-box-panel">
                        <input type="checkbox" name="en_oferta">
                        Producto en oferta
                    </label>
                </div>

                <div class="col-md-6">
                    <label class="check-box-panel">
                        <input type="checkbox" name="mostrar_cuotas">
                        Mostrar cuotas
                    </label>
                </div>

            </div>

            <div class="d-flex gap-3 mt-5">
                <button type="submit" class="btn-guardar-producto">
                    Agregar producto
                </button>

                <a href="{% url 'panel_admin' %}" class="btn-cancelar-producto">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</section>

{% endblock %}
